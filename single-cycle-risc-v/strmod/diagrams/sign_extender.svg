<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:s="https://github.com/nturley/netlistsvg" width="256" height="88">
  <style>svg {
    stroke:#000;
    fill:none;
  }
  text {
    fill:#000;
    stroke:none;
    font-size:10px;
    font-weight: bold;
    font-family: "Courier New", monospace;
  }
  .nodelabel {
    text-anchor: middle;
  }
  .inputPortLabel {
    text-anchor: end;
  }
  .splitjoinBody {
    fill:#000;
  }</style>
  <g s:type="inputExt" transform="translate(12,22)" s:width="30" s:height="20" id="cell_data_in">
    <text x="15" y="-4" class="nodelabel cell_data_in" s:attribute="ref">data_in</text>
    <s:alias val="$_inputExt_"/>
    <path d="M0,0 L0,20 L15,20 L30,10 L15,0 Z" class="cell_data_in"/>
    <g s:x="28" s:y="10" s:pid="Y"/>
  </g>
  <g s:type="outputExt" transform="translate(196,32)" s:width="30" s:height="20" id="cell_data_out">
    <text x="15" y="-4" class="nodelabel cell_data_out" s:attribute="ref">data_out</text>
    <s:alias val="$_outputExt_"/>
    <path d="M30,0 L30,20 L15,20 L0,10 L15,0 Z" class="cell_data_out"/>
    <g s:x="0" s:y="10" s:pid="A"/>
  </g>
  <g s:type="join" transform="translate(155,21.5)" s:width="4" s:height="40" id="cell_$join$,2,3,3,">
    <rect width="5" height="40" class="splitjoinBody" s:generic="body"/>
    <s:alias val="$_join_"/>
    <g s:x="5" s:y="20" s:pid="out"/>
    <g transform="translate(0,10)" s:x="0" s:y="10" s:pid="in0">
      <text x="-3" y="-4" class="inputPortLabel">N-1:0</text>
    </g>
    <g transform="translate(0,30)" s:x="0" s:y="10" s:pid="in0">
      <text x="-3" y="-4" class="inputPortLabel">M:N</text>
    </g>
  </g>
  <g s:type="split" transform="translate(89,43)" s:width="5" s:height="40" id="cell_$split$,2,3,">
    <rect width="5" height="20" class="splitjoinBody" s:generic="body"/>
    <s:alias val="$_split_"/>
    <g s:x="0" s:y="20" s:pid="in"/>
    <g transform="translate(4,10)" s:x="4" s:y="10" s:pid="out0">
	<text x="-24" y="-4">N-1</text>
      <text x="5" y="-4">1</text>
    </g>
  </g>
  <line x1="161" x2="196" y1="42" y2="42" class="net_2,3,3" stroke-width="2"/>
  <line x1="40" x2="155" y1="32" y2="32" class="net_2,3" stroke-width="2"/>
  <line x1="40" x2="64" y1="32" y2="32" class="net_2,3"/>
  <line x1="64" x2="64" y1="32" y2="56" class="net_2,3"/>
  <line x1="64" x2="89.5" y1="56" y2="56" class="net_2,3"/>
  <circle cx="64" cy="32" r="2" style="fill:#000" class="net_2,3"/>
  <line x1="94" x2="111" y1="53.5" y2="53.5" class="net_3" stroke-width="2"/>
  <line x1="111" x2="111" y1="53.5" y2="52" class="net_3" stroke-width="2"/>
  <line x1="111" x2="155" y1="52" y2="52" class="net_3" stroke-width="2"/>
</svg>
